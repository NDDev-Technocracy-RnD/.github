# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@c8385cf3321931b9e9f76820c720ec00d344c057 # v0.6.173
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      tool-assets: .github/ci-tools.json
