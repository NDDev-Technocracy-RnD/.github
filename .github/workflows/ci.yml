# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@1a409d4ee632eb594e58a6b291ce9e5a0ef51da2 # v0.6.37
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
