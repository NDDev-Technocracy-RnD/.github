# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@d70fed9613e0861124f6990fb2f4513d24741f26 # v0.6.76
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
      tool-assets: .github/ci-tools.json
