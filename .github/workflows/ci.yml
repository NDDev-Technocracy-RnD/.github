# Pull requests run the short check; dev runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@a1c996fc3197192e54a362603970a49e7960e555 # v0.6.27
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
