# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@ca07bd07d12c91f103ce481372100cab6c83d72f # v0.6.34
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
