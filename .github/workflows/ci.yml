# Pull requests run the short check; main runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@70fd10cf637d6133fde9c71ff754b410b3ef6504 # v0.6.36
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
