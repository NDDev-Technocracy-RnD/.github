# Pull requests run the short check; dev runs the full check.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [dev]
  workflow_dispatch:

permissions: {}

jobs:
  check:
    uses: NDDev-Technocracy-OpenNetwork/nddev-ci/.github/workflows/check.yml@52d8302d2272967a21fd8e3ae594205588648777 # v0.6.28
    permissions:
      contents: read
    with:
      hosted-runner: ubuntu-26.04
